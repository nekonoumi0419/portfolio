<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video with Fixed Header</title>
    <style>
        /* 画面全体の余白をゼロにし、真っ黒な背景で中央揃えの準備をします */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; /* スクロールバーを完全に消します */
        }

        /* 👑 最上部に固定するヘッダーの設定 */
        header {
            position: fixed; /* 画面に固定します */
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10; /* 動画より手前に表示させるための設定 */
            background-color: rgba(0, 0, 0, 0.5); /* 背景を半透明の黒（動画を少し透けさせる）に */
            padding: 15px 30px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px); /* 背景の動画をほんのりぼかして文字を読みやすくします */
        }

        header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        header nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        header nav a:hover {
            opacity: 0.7; /* ホバー時に少し薄くします */
        }

        /* 🎬 動画を画面いっぱいに配置する設定 */

            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
