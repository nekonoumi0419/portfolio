<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        /* 画面全体の余白をゼロにし、真っ黒な背景で中央揃えの準備をします */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* スクロールバーを完全に消します */
        }

        /* 動画を画面いっぱいに、かつアスペクト比を保って真ん中に配置します */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 動画の比率を崩さずに画面に収めます（画面に隙間なく広げたい場合は cover に変更してください） */
        }
    </style>
</head>
<body>

    <video src="251128_3.mp4" controls autoplay muted loop playsinline></video>

</body>
</html>
